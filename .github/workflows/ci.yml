name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A hang (a lost cancellation, a prompt waiting forever) fails the job
    # rather than holding the runner for GitHub's default 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS and Windows: the oldest and newest Python only.
        include:
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check thinking_prompt/

      - name: Type-check with mypy
        run: mypy thinking_prompt/

      # The examples are documentation: a call the API no longer takes (a
      # renamed keyword, a removed method) fails here, not in a user's hands.
      - name: Type-check the examples
        run: mypy examples/ --allow-untyped-defs --allow-incomplete-defs --check-untyped-defs --ignore-missing-imports

      - name: Run pytest
        run: pytest -v

  test-minimal:
    name: Test without optional extras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # NOTE: pygments is still present transitively (pytest>=8.4 depends on
      # it), so this job exercises only the no-rich fallback paths.
      - name: Install package with dev deps only (no rich)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if python -c "import rich" 2>/dev/null; then
            echo "rich must not be installed in this job" >&2
            exit 1
          fi

      - name: Run pytest
        run: pytest -v

  test-floors:
    name: Test the lowest supported versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      # The floors pyproject.toml declares: requires-python and each
      # dependency's lowest version. Keep them in step with it.
      - name: Install package with the lowest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "prompt_toolkit==3.0.36" "rich==13.2.0" "pygments==2.15.0"
          python -c "import importlib.metadata as m; print({d: m.version(d) for d in ('prompt_toolkit', 'rich', 'pygments')})"

      - name: Run pytest
        run: pytest -v

  test-package:
    name: Test the built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # The sdist is an allowlist (pyproject.toml): nothing untracked or
      # local gets in.
      - name: Check the sdist's contents
        run: |
          tar -tzf dist/*.tar.gz | sort
          if tar -tzf dist/*.tar.gz | grep -E '/(AGENTS\.md|\.superpowers|docs|changes)(/|$)'; then
            echo "the sdist holds files it shouldn't" >&2
            exit 1
          fi

      # The wheel installed in a clean venv, and the tests run from outside
      # the checkout, so the source tree can't stand in for the package.
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[dev,all]"
          mkdir /tmp/suite
          cp -r tests pyproject.toml /tmp/suite/
          cd /tmp/suite
          /tmp/venv/bin/python -c "import thinking_prompt; print(thinking_prompt.__file__); assert 'site-packages' in thinking_prompt.__file__"

      - name: Run pytest against the installed wheel
        working-directory: /tmp/suite
        run: /tmp/venv/bin/python -m pytest -v
