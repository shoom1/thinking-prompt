name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check thinking_prompt/

      - name: Type-check with mypy
        run: mypy thinking_prompt/

      - name: Run pytest
        run: pytest -v

  test-minimal:
    name: Test without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # NOTE: pygments is still present transitively (pytest>=8.4 depends on
      # it), so this job exercises only the no-rich fallback paths.
      - name: Install package with dev deps only (no rich)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import rich" 2>/dev/null && { echo "rich must not be installed in this job" >&2; exit 1; } || true

      - name: Run pytest
        run: pytest -v
